name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  publish:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag and reviewed source
        run: |
          printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          test "$RELEASE_TAG" = "v$(cat VERSION)"
          git merge-base --is-ancestor HEAD origin/main
          grep -q "^## ${RELEASE_TAG#v} " CHANGELOG.md
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: norvi-office-debian-candidate
          path: release-assets
      - name: Publish the exact tested candidate and corresponding source
        run: |
          cd release-assets
          sha256sum --check SHA256SUMS.txt
          rm SHA256SUMS.txt
          git -C .. archive --format=tar.gz --prefix=source/ HEAD > source.tar.gz
          sha256sum -- *.deb source.tar.gz > SHA256SUMS.txt
          gh release create "$RELEASE_TAG" ./* --verify-tag --title "$RELEASE_TAG" --generate-notes
