name: CI
on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: pip install ruff==0.15.20
      - run: ruff check .
      - run: python3 -m compileall -q scripts tests norvi-office/experiments
  native:
    runs-on: ubuntu-24.04
    container: ubuntu:26.04@sha256:da6fc2be547864451aa253836dd926da33623312df4a9a243e35dc877c378a78
    timeout-minutes: 30
    env:
      DEBIAN_FRONTEND: noninteractive
      GIO_USE_VFS: local
    steps:
      - name: Official runtime and build dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates build-essential pkg-config fakeroot \
            libgtk-3-dev gjs python3 python3-gi python3-gi-cairo python3-cairo python3-pil python3-uno \
            gir1.2-gtk-3.0 gir1.2-atspi-2.0 at-spi2-core desktop-file-utils xvfb xauth dbus dbus-x11 \
            libreoffice-writer libreoffice-calc libreoffice-impress libreoffice-draw libreoffice-base \
            libreoffice-math libreoffice-gtk3 libreoffice-style-sifr libreoffice-sdbc-postgresql default-jre-headless
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Qualify the exact candidate as an unprivileged desktop user
        run: |
          useradd --create-home office-test
          chown -R office-test "$GITHUB_WORKSPACE"
          runuser -u office-test -- bash scripts/native_ci.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: norvi-office-debian-candidate
          path: out/candidate/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: norvi-office-runtime-evidence
          path: |
            out/installed-runtime.log
            out/upstream.json
            out/format-contract.log
          retention-days: 14
  tests:
    name: tests
    if: always()
    needs: [source, native]
    runs-on: ubuntu-24.04
    steps:
      - name: Require installed native acceptance
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 -c 'import json,os; r=json.loads(os.environ["RESULTS"]); assert all(j["result"]=="success" for j in r.values()), r'
